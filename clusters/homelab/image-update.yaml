apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
    name: flux-system
    namespace: flux-system
spec:
    interval: 5m
    sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
    update:
        strategy: Setters
        path: ./apps/production
    git:
        commit:
            author:
                name: fluxcdbot
                email: fluxcdbot@users.noreply.github.com
            # One line per image changed, old -> new. Flux 2.8 removed .Updated; .Changed holds the changes.
            messageTemplate: |
                Update images

                {{ range .Changed.Changes -}}
                {{ .OldValue }} -> {{ .NewValue }}
                {{ end -}}