apiVersion: v1
kind: Service
metadata:
  name: vikunja-svc
  namespace: vikunja
  labels:
    app: vikunja
spec:
  ports:
    - port: 3456
      targetPort: server-tcp
      protocol: TCP
      name: server-svc-tcp
  selector:
    app: vikunja

---

# MetalLB gives this an address on the local network.
apiVersion: v1
kind: Service
metadata:
  name: vikunja-lb
  namespace: vikunja
  labels:
    app: vikunja
spec:
  type: LoadBalancer
  ports:
    - port: 3456
      targetPort: server-tcp
      protocol: TCP
      name: server-svc-tcp
  selector:
    app: vikunja
