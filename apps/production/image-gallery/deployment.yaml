apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-gallery
  namespace: image-gallery
  labels:
    app: image-gallery
spec:
  replicas: 1
  # One pod at a time: the image volume can only be mounted by one node.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: image-gallery
  template:
    metadata:
      labels:
        app: image-gallery
    spec:
      imagePullSecrets:
        - name: github-regcred
      securityContext:
        # The image runs as user 1000; this makes the volumes writable by it.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: image-gallery
          image: ghcr.io/opentoucan/image-gallery:RELEASE.2026-11-23T23-37-13 # {"$imagepolicy": "flux-system:image-gallery"}
          imagePullPolicy: Always
          env:
            - name: PICTURE_FOLDER
              value: "/images"
            - name: MONGODB_URI
              value: "mongodb://mongo-svc:27017"
            - name: MAX_UPLOAD_MB
              value: "1024"
            # Login sessions, kept on a volume so restarts and new versions don't log everyone out.
            - name: NICEGUI_STORAGE_PATH
              value: "/sessions"
          # STORAGE_SECRET, BOOTSTRAP_ADMIN_USERNAME and BOOTSTRAP_ADMIN_PASSWORD, created by hand.
          envFrom:
            - secretRef:
                name: image-gallery-secrets
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
              name: server-tcp
              protocol: TCP
          # The app answers 503 until it has connected to MongoDB and cleaned up storage, then /login answers 200.
          startupProbe:
            httpGet:
              path: /login
              port: server-tcp
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: server-tcp
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: server-tcp
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Processing a 100-megapixel image takes roughly 300 MB, more for 16-bit images.
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /images
            - name: tmp
              mountPath: /tmp
            - name: sessions
              mountPath: /sessions
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: image-pvc
        # Uploads are received here, needing about twice the batch while one arrives (MAX_UPLOAD_MB is 1 GiB).
        - name: tmp
          emptyDir:
            sizeLimit: 3Gi
        - name: sessions
          persistentVolumeClaim:
            claimName: sessions-pvc
